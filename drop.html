<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEATFEST SMOKE COMPANY</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <style>
    :root{
      --bg:#fff9f5;
      --text:#2b1810;
      --muted:#6b5345;
      --brand:#8b0000;
      --accent:#e4572e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:"Courier New",Courier,monospace;
      line-height:1.6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:3rem 1.5rem;
    }
    main{width:100%;min-width:0;max-width:640px;text-align:center;overflow-wrap:break-word}
    a{color:var(--brand);text-decoration:underline}
    a:hover{color:var(--accent)}

    .mark{
      width:100%;
      max-width:320px;
      height:auto;
      margin:0 auto 4rem;
      display:block;
      mix-blend-mode:multiply;
      opacity:.9;
    }

    h1{
      font-size:clamp(.95rem,2.6vw,1.1rem);
      font-weight:400;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--brand);
      margin:0 0 1.5rem;
    }
    .tagline{font-style:italic;letter-spacing:1.5px;font-size:clamp(.9rem,2.4vw,1rem);margin:0}
    .faq-line{
      margin:2.75rem 0 0;
      font-weight:700;
      letter-spacing:1.5px;
      font-size:clamp(.9rem,2.5vw,1.05rem);
    }
    .place{margin:5rem 0 0;letter-spacing:2px;font-size:clamp(.85rem,2.3vw,.95rem)}
    .follow{margin:1.25rem 0 0;letter-spacing:1.5px;font-size:clamp(.85rem,2.3vw,.95rem)}
    .follow strong{font-weight:700}
    .copyright{margin:3rem 0 0;letter-spacing:1.5px;font-size:.8rem;color:var(--muted)}

    @media (max-width:520px){
      body{padding:2.5rem 1.25rem}
      .mark{max-width:230px;margin-bottom:3rem}
      h1,.tagline,.faq-line,.place,.follow,.copyright{letter-spacing:1px}
      .place{margin-top:3.5rem}
      .copyright{font-size:.72rem}
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/img/meatfest-logo.png" alt="Meatfest formula: pig squared plus cow cubed plus turkey squared, over fire, equals infinity">

    <h1>Meatfest Smoke Company</h1>
    <p class="tagline">A Social Smokehouse Experiment</p>

    <p class="faq-line">Please <a href="/drop-faq.html">click here</a> for answers to some of our most Frequently Asked Questions.</p>

    <p class="place">Columbus, Ohio</p>

    <p class="follow">Follow &ldquo;<strong>Meatfest</strong>&rdquo; exclusively by word of mouth.</p>

    <p class="copyright">Copyright <span id="y"></span> (c) All Rights Reserved</p>
  </main>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
