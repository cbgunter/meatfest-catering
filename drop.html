<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEATFEST SMOKE COMPANY</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <style>
    :root{
      --bg:#fff9f5;
      --text:#2b1810;
      --muted:#6b5345;
      --brand:#8b0000;
      --accent:#e4572e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      line-height:1.7;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:3rem 1.5rem;
    }
    main{max-width:560px;text-align:center}
    a{color:var(--brand);text-decoration:underline}
    a:hover{color:var(--accent)}

    h1{
      font-size:clamp(1.4rem,4.5vw,2rem);
      font-weight:800;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--brand);
      margin:0 0 1rem;
    }
    .tagline{font-size:1rem;color:var(--text);margin:0}
    .faq-line{margin:4.5rem 0 0;font-size:.95rem}
    .place{margin:4.5rem 0 0;font-size:.95rem;color:var(--muted)}
    .follow{margin:3rem 0 0;font-size:.95rem;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <h1>Meatfest Smoke Company</h1>
    <p class="tagline">A Social Smokehouse Experiment</p>

    <p class="faq-line">Please <a href="/drop-faq.html">click here</a> for answers to some of our most Frequently Asked Questions.</p>

    <p class="place">Columbus, Ohio</p>

    <p class="follow">Follow &ldquo;Meatfest&rdquo; exclusively by word of mouth.</p>
  </main>
</body>
</html>
